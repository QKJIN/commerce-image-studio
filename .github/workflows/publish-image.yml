name: Check and publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            SITE_URL=${{ vars.SITE_URL }}
          tags: |
            ghcr.io/qkjin/commerce-image-studio:latest
            ghcr.io/qkjin/commerce-image-studio:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/QKJIN/commerce-image-studio
            org.opencontainers.image.licenses=MIT
